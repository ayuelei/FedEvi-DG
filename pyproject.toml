[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fedevi-dg"
version = "0.1.0"
description = "Federated breast ultrasound classification with heterogeneous auxiliary annotations"
requires-python = ">=3.12,<3.13"
license = {file = "LICENSE"}

[tool.setuptools.packages.find]
include = ["fedevi_dg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts"]
